# fly.toml app configuration file generated for order-app-c491na on 2026-10-18T15:49:55Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'order-app-c491na'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
