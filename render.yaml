services:
  - type: web
    name: order-app
    runtime: docker
    plan: free
    region: singapore
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: order-app-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GUEST_COOKIE_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: AUTO_SEED
        value: "false"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:contact@phoco.vn
      - key: ORDERING_MODE
        value: approved_single_device

databases:
  - name: order-app-db
    plan: free
    region: singapore
    databaseName: qr_order_db
    user: qr_user
